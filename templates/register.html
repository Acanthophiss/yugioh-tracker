<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Εγγραφή - Yu-Gi-Oh! Tracker</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; background: #2c2c2c; border: 1px solid #444; color: #fff; border-radius: 4px; }
        button { width: 95%; padding: 10px; background: #5cb85c; border: none; color: white; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #4cae4c; }
        a { color: #5bc0de; text-decoration: none; display: block; margin-top: 15px; }
        .flash { color: #ff6b6b; font-size: 14px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Εγγραφή</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="username" placeholder="Όνομα Χρήστη" required><br>
            <input type="password" name="password" placeholder="Κωδικός" required><br>
            <button type="submit">Εγγραφή</button>
        </form>
        <a href="{{ url_for('login') }}">Έχεις ήδη λογαριασμό; Σύνδεση</a>
    </div>
</body>
</html>
